# Codex uses config.toml rather than settings.json.
#
# Copy this file to either:
#   ~/.codex/config.toml          personal default
#   <project>/.codex/config.toml  trusted-project setting
#
# Keydris still owns the identity lifecycle through `keydris codex`; this file
# does not replace the wrapper.

sandbox_mode = "workspace-write"
# Keydris blocks rejected and approval-required commands in PreToolUse.
# Codex cannot reliably force a policy approval prompt; native approval settings
# must never turn a policy decision into permission to execute.
approval_policy = "on-request"

[windows]
# Required for the managed networking enabled by `keydris codex` on Windows.
# Complete Codex's administrator-approved sandbox setup before launching.
sandbox = "elevated"

[sandbox_workspace_write]
# Permit sandboxed commands to reach the authenticated Keydris proxy inherited
# from `keydris codex`. Keep the Codex sandbox enabled; do not use
# danger-full-access for this integration.
network_access = true
