# Keydris stable-channel defaults. The stable installer writes this to ~/.keydris.toml:
#   curl -fsSL https://get.keydris.com/keydris-cli/install.sh | bash
#
# Lowest-precedence config: override any value with an env var, ./.env, or a
# project-local ./.keydris.toml. Each key maps to KEYDRIS_<UPPER(KEY)>.
#
# Fill in the <...> placeholders with your deployed stable endpoints before publishing.

[keydris]
# `keydris upgrade` reads this to stay on the channel this install came from.
channel = "stable"

# Deployed stable control plane behind the AWS ALB. control_url is the standard-HTTPS
# side on :443 (/identity/sign, /agent/jwks); control_mtls_url is the mTLS
# /agent/authorize* listener on :8443. Both present a public TLS server cert, so
# no server-CA pin is needed (leave KEYDRIS_MTLS_SERVER_CA unset).
control_url      = "https://api.keydris.com"
control_mtls_url = "https://api.keydris.com:8443"
trust_domain     = "keydris.local"

# Sign-in via Cognito, so `keydris login` opens the hosted UI with no env vars.
# oauth_client_id is the stable CLI app client; its access token's client_id must
# match for /identity/sign to accept it.
oidc_issuer        = "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ft2ArrhS7"
cognito_domain     = "https://auth.keydris.com"
oauth_client_id    = "6rll39d1l5hq1irjag9o4cu8m2"
oauth_scopes       = "openid email"
oauth_redirect_url = "http://localhost:3000/callback"
